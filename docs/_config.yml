# GitHub Pages (Jekyll) config — zero build step, native GH Pages support.
# Enable at: repo Settings → Pages → Source: Deploy from a branch → main / docs

title: React Native Liquid Glass
tagline: Authentic iOS 26 Liquid Glass + real Android glass refraction for React Native
description: >-
  A React Native library that brings authentic Liquid Glass to both iOS and
  Android from one declarative component. iOS 26 renders Apple's native
  UIGlassEffect; Android reproduces the optics with a real-time AGSL
  refractive-lens shader. Custom shapes, interactive touch/tilt, Expo config
  plugin, New Architecture ready, TypeScript.

# IMPORTANT: set this to your published GitHub Pages URL once live.
url: "https://himanshu-lal4.github.io"
baseurl: "/react-native-liquid-glassmorphism"

author: Himanshu Lal
lang: en_US

theme: minima

plugins:
  - jekyll-seo-tag      # emits <title>, meta description, Open Graph, Twitter cards, JSON-LD
  - jekyll-sitemap      # auto-generates /sitemap.xml for crawlers & answer engines

# Surfaced by jekyll-seo-tag into social/OG cards
logo: https://github.com/himanshu-lal4/react-native-liquid-glassmorphism/releases/download/v0.1.0/reel-ios.gif
twitter:
  card: summary_large_image

# Search-engine ownership verification (emitted as <meta> by jekyll-seo-tag).
# Google Search Console powers Google AI Overviews + Gemini grounding.
# Bing (add its token here if not importing from Google) powers ChatGPT Search + Copilot.
webmaster_verifications:
  google: 4dJ-yl_lAXmI27TlOseUbiBvmPjTlE7wWhdGVnvTZss

# Repo/npm links used across pages
repo_url: https://github.com/himanshu-lal4/react-native-liquid-glassmorphism
npm_url: https://www.npmjs.com/package/react-native-liquid-glassmorphism

# Drives the npm CTA bar + footer CTA rendered on every page by _layouts/default.html
npm_install: "npm install react-native-liquid-glassmorphism"
npm_badge_slug: "react-native-liquid-glassmorphism"
github_slug: "himanshu-lal4/react-native-liquid-glassmorphism"

header_pages:
  - getting-started.md
  - recipes.md
  - android-liquid-glass.md
  - ios-26-liquid-glass.md
  - expo-liquid-glass.md
  - faq.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
