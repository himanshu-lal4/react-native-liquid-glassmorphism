# GitHub Pages (Jekyll) config — zero build step, native GH Pages support.
# Enable at: repo Settings → Pages → Source: Deploy from a branch → main / docs

title: React Native Liquid Glass
tagline: Liquid Glass for React Native on Android AND iOS — not an iOS-only wrapper
description: >-
  The React Native Liquid Glass library that works on Android as well as iOS.
  Most alternatives are iOS-only; this one renders Apple's native UIGlassEffect
  on iOS 26 and reproduces the same optics on Android 13+ with a real-time AGSL
  refractive-lens shader, from a single <LiquidGlassView> component. Also known
  as React Native glassmorphism, frosted glass, glass effect, glass blur or
  backdrop blur. Custom shapes, interactive touch/tilt, Expo config plugin,
  New Architecture ready, TypeScript.

