name: Publish to npm

# Publishes react-native-liquid-glassmorphism to npmjs.com with provenance,
# which is what puts the "Provenance" / verified badge next to the version
# on the npm page. Provenance can ONLY be generated from CI — a local
# `npm publish` will never produce one.
#
# Auth uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed.
# One-time setup on npmjs.com, under the package's Settings → Trusted Publisher:
#   Publisher:  GitHub Actions
#   Repository: himanshu-lal4/react-native-liquid-glassmorphism
#   Workflow:   publish-npm.yml
#   Environment: (leave blank)
#
# Until that is configured, this workflow will fail at the publish step with
# an auth error — that is expected, not a bug in the workflow.
#
# To smoke-test auth without publishing anything: dispatch this manually while
# package.json's version is one already on npm. Auth happens first, so a
# "cannot publish over previously published versions" failure means trusted
# publishing works, whereas an OIDC/token error means the registration does
# not match.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for provenance / trusted publishing

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm >= 11.5.1, which is where OIDC landed.
      # Pinned to the 11.x line rather than @latest on purpose: npm 12 requires
      # Node ^22.22.2 || ^24.15.0 || >=26, and .nvmrc pins v24.13.0, so
      # `npm@latest` fails the install outright with EBADENGINE and takes the
      # whole release with it. Raise this only alongside .nvmrc.
      - name: Pin npm to a version that supports trusted publishing
        run: npm install -g npm@^11

      # Fail loudly here rather than quietly publishing without provenance.
      - name: Verify npm supports trusted publishing
        run: |
          NPM_V="$(npm --version)"
          echo "npm ${NPM_V} on node $(node --version)"
          MAJOR="${NPM_V%%.*}"
          REST="${NPM_V#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "npm ${NPM_V} is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi

      - name: Build package
        run: yarn build

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
