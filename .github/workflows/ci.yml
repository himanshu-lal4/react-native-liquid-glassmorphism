name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the diff so the expensive jobs only run when they can actually
  # tell us something.
  #
  # Two outputs, because "changed" is not one question:
  #   code   — anything that isn't docs. Gates lint/typecheck and the library build.
  #   native — something that can change the compiled app: native sources, the
  #            codegen spec, dependencies, the example app, or CI itself.
  #
  # The native build jobs are required status checks, so we can't skip them with
  # `on.paths` — that leaves the required check pending forever and blocks the
  # PR. A job-level `if:` works instead: a skipped required job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          BASE=""
          HEAD=""
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}" ;;
            push)         BASE="${{ github.event.before }}";               HEAD="${{ github.sha }}" ;;
            merge_group)  BASE="${{ github.event.merge_group.base_sha }}"; HEAD="${{ github.event.merge_group.head_sha }}" ;;
          esac

          # If we can't resolve a diff range, build to be safe.
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true"   >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "No base ref — running everything."
            exit 0
          fi

          git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags --depth=100 origin "$BASE" 2>/dev/null || true

          if ! CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); then
            echo "code=true"   >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Diff failed — running everything."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # "code" = anything that isn't docs, the growth kit, markdown, or LICENSE.
          if printf '%s\n' "$CHANGED" | grep -vE '^(docs/|growth/|llms\.txt$|LICENSE$|.*\.md$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changed — running lint and the library build."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change."
          fi

          # "native" = anything that can change the compiled app.
          #
          # Deliberately NOT all of src/: a pure TypeScript change cannot alter
          # the native binaries, and lint, typecheck, jest and the library build
          # already cover it. The one exception is the codegen spec, which
          # generates the native view-manager interface — a change there breaks
          # the Kotlin/ObjC++ build and must be caught here.
          NATIVE_RE='^(android/|ios/|cpp/|example/|plugin/|\.github/)'
          NATIVE_RE="$NATIVE_RE"'|^(package\.json|yarn\.lock|react-native\.config\.js|app\.plugin\.js|babel\.config\.js)$'
          NATIVE_RE="$NATIVE_RE"'|\.podspec$'
          NATIVE_RE="$NATIVE_RE"'|^src/LiquidGlassmorphismViewNativeComponent\.ts$'

          if printf '%s\n' "$CHANGED" | grep -qE "$NATIVE_RE"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Native-affecting change — running the Android and iOS builds."
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "No native-affecting change — skipping the Android and iOS builds."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck


  build-library:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild expo app for Android
        if: env.turbo_cache_hit != 1
        run: |
          yarn example expo prebuild --platform android

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Prebuild expo app for iOS
        if: env.turbo_cache_hit != 1
        run: |
          yarn example expo prebuild --platform ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
